syntax = "proto3";
package Bag;
option module = 100;

// ============================================================
// 共享定义
// ============================================================

// 背包道具定义
message BagItem
{
  int32 ItemId = 1; // 道具id
  int64 Count = 2;  // 道具数量
}

// ============================================================
// 请求 / 响应（Req / Resp）
// ============================================================

// 请求背包数据
message ReqBagInfo {}

// 背包数据响应
message RespBagInfo
{
  map<int32, int64> ItemDic = 1; // 道具字典，key:道具id，value:道具数量
}

// 请求使用道具
message ReqUseItem
{
  int32 ItemId = 1; // 道具id
  int64 Count = 2;  // 使用数量
}

// 使用道具响应
message RespUseItem
{
  int32 ItemId = 1; // 道具id
  int64 Count = 2;  // 使用后剩余的道具数量
}

// 请求增加道具
message ReqAddItem
{
  map<int32, int64> ItemDic = 1; // 增加的道具，key:道具id，value:增加数量
}

// 增加道具响应
message RespAddItem
{
  map<int32, int64> ItemDic = 1; // 变化的道具，key:道具id，value:数量
}

// 请求减少道具
message ReqRemoveItem
{
  map<int32, int64> ItemDic = 1; // 减少的道具，key:道具id，value:减少数量
}

// 减少道具响应
message RespRemoveItem
{
  map<int32, int64> ItemDic = 1; // 变化的道具，key:道具id，value:数量
}

// ============================================================
// 服务器推送（Notify）
// ============================================================

// 单个道具变化通知
message NotifyBagItem
{
  int32 ItemId = 1; // 道具id
  int64 Count = 2;  // 最终道具数量
  int64 Value = 3;  // 变化的值
}

// 背包数据变化通知
message NotifyBagInfoChanged
{
  map<int32, NotifyBagItem> ItemDic = 1; // 变化的道具，key:道具id，value:变化信息
}
