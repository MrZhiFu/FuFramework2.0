syntax = "proto3";
package User;
option module = 300;

// ============================================================
// 共享定义
// ============================================================

// 角色信息定义
message PlayerInfo
{
  int64 Id = 1;          // 角色ID
  string Name = 2;       // 角色名
  uint32 Level = 3;      // 角色等级
  int32 State = 4;       // 角色状态
  uint32 Avatar = 5;     // 角色头像
  uint64 CurrentExp = 6; // 角色当前经验
}

// ============================================================
// 请求 / 响应（Req / Resp）
// ============================================================

// 请求账号登录
message ReqUserLogin
{
  option opcode = 10;
  string UserName = 1; // 用户名
  string Platform = 2; // 平台
  int32 SdkType = 3;   // sdk类型
  string SdkToken = 4; // SdkToken
  string Device = 5;   // 设备
  string Password = 6; // 密码
}

// 账号登录响应
message RespUserLogin
{
  option opcode = 11;
  int32 Code = 1;       // 返回码
  string RoleName = 2;  // 账号名
  int64 Id = 3;         // 账号ID
  uint32 Level = 4;     // 账号等级
  int64 CreateTime = 5; // 创建时间
}

// 请求角色创建
message ReqPlayerCreate
{
  option opcode = 12;
  int64 Id = 1;    // 账号ID
  string Name = 2; // 角色名
}

// 角色创建响应
message RespPlayerCreate
{
  option opcode = 13;
  PlayerInfo PlayerInfo = 1; // 角色信息
}

// 请求角色列表
message ReqPlayerList
{
  option opcode = 14;
  int64 Id = 1; // 账号ID
}

// 角色列表响应
message RespPlayerList
{
  option opcode = 15;
  repeated PlayerInfo PlayerList = 1; // 角色列表
}

// 请求玩家登录
message ReqPlayerLogin
{
  option opcode = 16;
  int64 Id = 1; // 角色ID
}

// 玩家登录响应
message RespPlayerLogin
{
  option opcode = 17;
  int32 Code = 1;            // 返回码
  int64 CreateTime = 2;      // 创建时间
  PlayerInfo PlayerInfo = 3; // 角色信息
}

// ============================================================
// 服务器推送（Notify）
// ============================================================

// 错误码通知（每个请求的旁路错误回复）
message NotifyErrorCode
{
  option opcode = 18;
  int64 ErrCode = 1; // 0:表示无错误
  string Desc = 2;   // 错误描述（不为0时有效）
}

// 提示信息通知
message NotifyPrompt
{
  option opcode = 19;
  int32 Type = 1;     // 提示信息类型（1Tip提示，2跑马灯，3插队跑马灯，4弹窗，5弹窗回到登陆，6弹窗退出游戏）
  string Content = 2; // 提示内容
}
